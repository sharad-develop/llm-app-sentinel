# Default rule pack for llm-sentinel stage 3 (rule_checks).
# Each rule has an id, a category, and a regex applied to the normalized
# prompt (case-insensitive unless the pattern says otherwise).

injection_patterns:
  - id: role_override
    description: Attempts to override the assistant's role or instructions
    pattern: '(ignore|disregard|forget)\s+(all\s+|any\s+)?(previous|prior|above|earlier)\s+(instructions?|prompts?|rules?|directives?)'
  - id: system_impersonation
    description: Pretending to speak as the system or developer
    pattern: '\b(you\s+are\s+now|act\s+as\s+if\s+you\s+are|pretend\s+(that\s+)?you\s+are)\s+(the\s+)?(system|developer|admin|root|dan)\b'
  - id: reveal_instructions
    description: Asking the model to reveal its hidden instructions
    pattern: '(reveal|show|print|repeat|output)\s+(your\s+|the\s+)?(system\s+prompt|hidden\s+(instructions?|prompt)|initial\s+instructions?)'
  - id: jailbreak_marker
    description: Common jailbreak persona markers
    pattern: '\b(do\s+anything\s+now|developer\s+mode\s+enabled|jailbreak(ed)?\s+mode)\b'
  - id: role_override_multilingual
    description: '"Ignore previous instructions" in Spanish, French, German, Portuguese, Italian, Russian, Chinese, Japanese, Korean'
    pattern: '(ignora(r)?\s+(todas\s+)?las\s+(instrucciones|indicaciones)\s+(anteriores|previas)|ignore[zr]?\s+(toutes\s+)?(les\s+)?(instructions|consignes)\s+pr[ée]c[ée]dentes|ignorier(e|en)?\s+(alle\s+)?(vorherigen|bisherigen|obigen|fr[üu]heren)\s+(anweisungen|instruktionen|befehle)|ignor(e|ar)\s+(todas\s+as\s+)?instru[cç](õ|o)es\s+anteriores|ignora\s+(tutte\s+)?le\s+(istruzioni|indicazioni)\s+precedenti|(игнорируй|игнорируйте|забудь|забудьте)\s+(все\s+)?(предыдущие|прежние|прошлые|вышеуказанные)\s+(инструкции|указания|команды)|(忽略|无视|忘记|忘掉)(你)?(之前|以上|先前|前面|上述|所有)(的)?(所有|全部)?(指令|指示|提示|说明|规则)|(以前|これまで|上記|先ほど)の(指示|命令|ルール|プロンプト)を(すべて)?(無視|忘れ)|(이전|위의|앞의)\s*(모든\s*)?(지시|명령|지침)(사항)?(을|를)?\s*(모두\s*|전부\s*)?(무시|잊))'

delimiter_patterns:
  - id: fake_system_delimiter
    description: Suspicious system/instruction delimiter blocks
    pattern: '(\[/?(INST|SYS|SYSTEM)\]|<\|?(im_start|im_end|system|endoftext)\|?>|-{3,}\s*(SYSTEM|BEGIN\s+(NEW\s+)?INSTRUCTIONS?)\s*-{0,3})'
  - id: chat_template_tokens
    description: Raw chat-template control tokens
    pattern: '(<\|assistant\|>|<\|user\|>|<<SYS>>|\[system\]\s*:)'

secret_patterns:
  - id: openai_key
    description: OpenAI-style API key
    pattern: '\bsk-[a-zA-Z0-9_-]{20,}\b'
  - id: anthropic_key
    description: Anthropic API key
    pattern: '\bsk-ant-[a-zA-Z0-9_-]{20,}\b'
  - id: aws_access_key
    description: AWS access key id
    pattern: '\bAKIA[0-9A-Z]{16}\b'
  - id: github_token
    description: GitHub personal access token
    pattern: '\bgh[pousr]_[A-Za-z0-9]{36,}\b'
  - id: private_key_block
    description: PEM private key material
    pattern: '-----BEGIN\s+([A-Z]+\s+)*PRIVATE\s+KEY(\s+BLOCK)?-----'
  - id: github_fine_grained_token
    description: GitHub fine-grained personal access token
    pattern: '(?-i:\bgithub_pat_[A-Za-z0-9_]{50,}\b)'
  - id: gitlab_token
    description: GitLab personal access token
    pattern: '(?-i:\bglpat-[A-Za-z0-9_-]{20,}\b)'
  - id: slack_token
    description: Slack bot/user/app token
    pattern: '(?-i:\bxox[abeprs]-[A-Za-z0-9-]{10,}\b)'
  - id: slack_webhook
    description: Slack incoming-webhook URL
    pattern: 'https://hooks\.slack\.com/services/T[A-Za-z0-9]+/B[A-Za-z0-9]+/[A-Za-z0-9]+'
  - id: stripe_key
    description: Stripe secret or restricted key
    pattern: '(?-i:\b[sr]k_(live|test)_[A-Za-z0-9]{16,}\b)'
  - id: google_api_key
    description: Google API key
    pattern: '(?-i:\bAIza[0-9A-Za-z_-]{35}\b)'
  - id: huggingface_token
    description: Hugging Face access token
    pattern: '(?-i:\bhf_[A-Za-z0-9]{34,}\b)'
  - id: npm_token
    description: npm access token
    pattern: '(?-i:\bnpm_[A-Za-z0-9]{36}\b)'
  - id: sendgrid_key
    description: SendGrid API key
    pattern: '(?-i:\bSG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}\b)'
  - id: aws_temp_access_key
    description: AWS temporary/role access key id
    pattern: '(?-i:\b(ASIA|AROA|AIDA)[0-9A-Z]{16}\b)'
  - id: jwt
    description: JSON Web Token (header.payload.signature)
    pattern: '(?-i:\beyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,})'
  - id: credentials_in_url
    description: Credentials embedded in a connection string or URL
    pattern: '\b[a-z][a-z0-9+.-]{1,20}://[^\s:/@]{1,64}:[^\s:/@]{3,}@[^\s/]+'
