[project]
name = "llm-sentinel"
version = "0.1.0"
description = "Defense-in-depth input/output guard for LLM applications (Python SDK)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "nh3>=0.2.18",
    "markdown-it-py>=3.0",
    "sqlparse>=0.5",
]

[project.optional-dependencies]
ml = [
    "transformers>=4.44",
    "torch>=2.3",
]
dev = [
    "pytest>=8.0",
]
# Supply-chain / static-analysis tooling run in CI (see .github/workflows/ci.yml).
security = [
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
    "semgrep>=1.70",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.setuptools.package-data]
"sentinel" = ["rules/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", "build"]
