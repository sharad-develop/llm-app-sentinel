# Example application policy. Filename or `id` = application_id.
id: support-bot

capabilities:
  allowed: [web_search, kb_lookup]
  blocked: [code_execution, file_write]   # explicit deny wins over allowed

# Optional per-role capability overrides. Roles come from the
# IdentityProvider (see sentinel/identity.py). First matching role wins.
roles:
  admin:
    capabilities:
      allowed: [web_search, kb_lookup, code_execution]
      blocked: [file_write]

topics:
  blocked:
    - id: medical_advice
      keywords: [diagnosis, prescription, dosage]
    - id: competitors
      keywords: [acme corp, globex]

pii:
  action: redact            # block | redact | flag
  entities: [EMAIL, PHONE, SSN, CREDIT_CARD, PERSON, ADDRESS]

# Improper output handling (LLM05): how model responses may contain images,
# links and HTML. Defaults: images strip, links allow, html sanitize.
output:
  images: strip
  links: allowlist
  allowed_domains: [docs.acme.com]
  html: sanitize
  # sql: readonly        # for text-to-SQL apps; default allow
  # secrets: redact      # unknown-format secrets: allow | flag (default) | redact | block

# Agent tool calls (LLM06). Deny-by-default: only listed tools, with only the
# listed arguments, are allowed. Checked by guard.check_tool_call() or
# POST /v1/tools/check. A role's own `tools:` replaces this section.
tools:
  allowed:
    search_kb:
      args:
        query: {type: string, required: true, max_length: 500}
        limit: {type: integer, minimum: 1, maximum: 20}
    read_doc:
      args:
        path: {kind: path, roots: [/srv/docs], required: true}
    fetch_page:
      args:
        url: {kind: url, allowed_domains: [docs.acme.com], required: true}
    lookup_order:
      args:
        sql: {kind: sql, required: true}   # read-only unless `readonly: false`
    send_email:
      confirm: true                        # valid calls return `review`
      args:
        to: {pattern: '[^@\s]+@acme\.com', required: true}
        subject: {max_length: 200}
        body: {max_length: 5000}
